spring.application.name=WorkerBackend
server.port=8090
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/worker_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# REST API Configuration (Standard camelCase)
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE

# HikariCP Tuning
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000

# Servlet container back-pressure for high concurrent request bursts
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:200}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:20}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:100}
server.tomcat.max-connections=${SERVER_TOMCAT_MAX_CONNECTIONS:8192}

# Monitoring & Observability
management.endpoints.web.exposure.include=health,prometheus,info,metrics
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when-authorized}
management.prometheus.metrics.export.enabled=true

# Caching & Session
spring.cache.type=redis
spring.session.store-type=none
management.health.redis.enabled=true
spring.data.redis.repositories.enabled=false

# Redis Resilience Properties
spring.data.redis.timeout=500ms
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-wait=200ms
spring.data.redis.lettuce.shutdown-timeout=100ms


# Security Configuration
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_ACCESS_EXPIRATION:900000}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# CORS Configuration
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://10.0.2.2:8081,http://localhost:8081}
application.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
application.cors.allowed-headers=Authorization,Content-Type,X-XSRF-TOKEN

# Resilience4j Properties
resilience4j.circuitbreaker.instances.firebase.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.firebase.slidingWindowSize=10
resilience4j.retry.instances.db-retry.maxAttempts=3
resilience4j.retry.instances.db-retry.waitDuration=500ms
resilience4j.bulkhead.instances.api-bulkhead.maxConcurrentCalls=10


